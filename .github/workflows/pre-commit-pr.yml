name: post-commit-push

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The organization only allows actions owned by IEResearchDatalab, so every
# step below is a plain shell command instead of a third-party `uses:` action.
jobs:
  post-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Full history of the pushed commit, as with checkout's fetch-depth: 0
          git -c http.extraheader="$auth" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Set up uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.28/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # pre-commit is a dev dependency, so it runs from the project venv
      - name: Install dependencies
        run: uv sync --dev --frozen
      # Run hooks after commits are pushed
      - name: Run pre-commit
        run: uv run pre-commit run --show-diff-on-failure --color=always --all-files --hook-stage post-commit
